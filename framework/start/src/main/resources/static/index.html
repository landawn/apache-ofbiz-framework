<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFBiz Spring Web</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #dbe3ee;
      --link: #0a66cc;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 760px;
      margin: 36px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    ul {
      margin: 10px 0 0;
      padding-left: 18px;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    code {
      background: #eef3fa;
      border-radius: 4px;
      padding: 1px 5px;
    }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>OFBiz Spring Web</h1>
    <p>
      Frontend entry is now served by Spring Web at <code>/</code>.
      Legacy OFBiz UI paths are redirected here.
      Legacy child-webapp deployment is disabled by default.
    </p>
    <ul>
      <li><a href="/api/system/ping">System Ping API</a></li>
      <li><a href="/api/system/status">System Status API</a></li>
      <li><a href="/api/services">Exported Services API</a></li>
      <li><a href="/api/services/all">All Services Catalog API</a></li>
      <li><a href="/api/products/DEMO_1">Sample Product API call</a></li>
    </ul>
  </section>
</main>
</body>
</html>
