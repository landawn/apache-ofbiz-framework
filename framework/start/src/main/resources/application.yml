server:
  port: 8080

spring:
  application:
    name: ofbiz-spring-web
  main:
    lazy-initialization: true

# OFBiz configuration
ofbiz:
  home: .
  spring:
    legacy-webapps:
      enabled: true
  admin:
    host: 127.0.0.1
    port: 0
  log:
    dir: runtime/logs
  entity:
    delegator: default
  start:
    loaders: spring

logging:
  level:
    # Suppress noisy INFO logs when a TLS handshake is mistakenly sent to the HTTP port.
    org.apache.coyote.http11.Http11Processor: ERROR
